name: Semgrep PHP Web Security Scan

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  semgrep:
    name: PHP Web Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. 소스 체크아웃
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Python 설치
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # 3. Semgrep 설치
      # =====================================================
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep


      # =====================================================
      # 4. Semgrep 버전 확인
      # =====================================================
      - name: Check Semgrep version
        run: |
          semgrep --version


      # =====================================================
      # 5. PHP 웹 취약점 검사
      #
      # 검사 대상:
      # - SQL Injection
      # - XSS
      # - Command Injection
      # - File Inclusion
      # - Path Traversal
      # =====================================================
      - name: Run PHP Web Vulnerability Scan
        run: |
          semgrep scan \
            --config=.semgrep/php-web-security.yml \
            --sarif-output=semgrep.sarif \
            .


      # =====================================================
      # 6. SARIF 파일 확인
      # =====================================================
      - name: Check SARIF result
        if: always()
        run: |
          ls -lh semgrep.sarif || true


      # =====================================================
      # 7. GitHub Code Scanning으로 결과 업로드
      # =====================================================
      - name: Upload Semgrep results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php-web-security